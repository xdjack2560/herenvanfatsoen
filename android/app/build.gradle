plugins { id 'com.android.application' }

// Ondertekening: zet keystore.properties (niet in git!) naast deze map met storeFile, storePassword, keyAlias, keyPassword.
def ksFile = rootProject.file("keystore.properties")
// Ploegwachtwoord voor automatisch inloggen in de app: app-secrets.properties (niet in git) met teamWachtwoord=...
def secretsFile = rootProject.file("app-secrets.properties")
def secrets = new Properties()
if (secretsFile.exists()) secrets.load(new FileInputStream(secretsFile))
def ks = new Properties()
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'be.herenvanfatsoen.app'
    compileSdk 34
    defaultConfig {
        applicationId "be.herenvanfatsoen.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
        buildConfigField "String", "TEAM_WACHTWOORD", "\"" + (secrets['teamWachtwoord'] ?: "") + "\""
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
